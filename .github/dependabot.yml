version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions that have been public for a week, so hijacked
    # releases are usually pulled before they reach this repository.
    cooldown:
      default-days: 7
    # Major versions are upgraded by hand: TypeScript has to stay within what
    # typescript-eslint supports and @types/node has to match the Node 24 runtime.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
  # Base images are pinned by digest; this keeps the digests current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
